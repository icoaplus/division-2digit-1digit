<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二けた÷一けたのわり算｜iPad横向き版</title>
<style>
:root{
  --bg:#f8f4e7; --ink:#24313f; --line:#111;
  --blue:#5f9ed2; --blueSoft:#cfe4f4;
  --pink:#f6cff2; --mint:#bdf2ce; --yellow:#f7ee99; --cyan:#baf2f4;
  --orange:#ff8a1f; --green:#64bb47;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;background:#eef7fb;color:var(--ink)}
button,input{font:inherit}
body{padding:8px}
.rotate-note{display:none}

.app{
  width:100%;height:calc(100dvh - 16px);
  background:var(--bg);border:2px solid #8d8d8d;border-radius:22px;
  padding:14px 16px;overflow:hidden;
}
.layout{
  height:100%;display:grid;
  grid-template-rows:150px 1fr;gap:10px;
}
.top{
  min-height:0;
}
.title{font-size:26px;font-weight:1000;color:#000;margin:0 0 8px}
.problem{
  display:grid;grid-template-columns:110px 34px 110px 70px 125px 125px;
  gap:12px;align-items:start;width:max-content;
}
.group{display:grid;gap:5px}
.number{
  width:110px;height:64px;border:3px solid #111;border-radius:14px;background:#fff;
  font-size:40px;font-weight:1000;text-align:center;color:#000;
}
.div{font-size:58px;font-weight:1000;line-height:1;text-align:center;align-self:center}
.cap{font-size:15px;text-align:center;color:#000}
.reset{
  width:70px;height:70px;border:0;border-radius:50%;background:#ee8aeb;font-size:14px;font-weight:900
}
.nav{
  width:125px;height:42px;border:3px solid #111;border-radius:8px;background:var(--blueSoft);
  font-size:17px;font-weight:900;margin-top:12px
}
.nav:disabled{opacity:.42}

.body{
  min-height:0;
  display:grid;
  grid-template-columns:36% 25% 39%;
  gap:12px;
}
.col{min-height:0;display:grid;grid-template-rows:auto 1fr;gap:6px}
.head{font-size:26px;font-weight:1000;color:#000;margin:0;line-height:1}

.steps{
  min-height:0;display:grid;grid-template-rows:repeat(7,minmax(0,1fr));gap:7px
}
.step{
  min-height:0;border:3px solid #111;border-radius:14px;background:#fff;
  display:grid;grid-template-columns:58px 58px 1fr;align-items:center;overflow:hidden
}
.step.active{box-shadow:inset 0 0 0 4px rgba(95,158,210,.25)}
.step-no{height:100%;display:grid;place-items:center;font-size:28px;font-weight:1000;color:#000}
.iconbox{height:100%;background:var(--blue);border-left:3px solid #111;border-right:3px solid #111;display:grid;place-items:center}
.icon{width:84%;aspect-ratio:1;object-fit:cover}
.badge{margin:0 9px;border:3px solid #111;border-radius:9px;padding:7px 6px;text-align:center;font-size:18px;font-weight:900;color:#000;white-space:nowrap}
.tateru{background:var(--pink)} .kakeru{background:var(--mint)} .hiku{background:var(--yellow)} .orosu{background:var(--cyan)}

.explain{
  min-height:0;border:3px solid #111;border-radius:34px;background:#fff;padding:10px;
  display:grid;grid-template-rows:62px 1fr;gap:10px;overflow:hidden
}
.explain-top{display:grid;grid-template-columns:52px 52px 1fr;height:62px}
.current-no{border:3px solid #111;border-right:0;border-radius:10px 0 0 10px;display:grid;place-items:center;font-size:26px;font-weight:1000;color:#000}
.current-icon{border:3px solid #111;background:var(--blue);display:grid;place-items:center}
.current-icon img{width:84%;aspect-ratio:1;object-fit:cover}
.current-badge{margin-left:9px;align-self:center}
.desc{
  min-height:0;border-radius:18px;background:#fffdf5;padding:10px 10px;
  font-size:clamp(22px,2.1vw,34px);font-weight:1000;line-height:1.28;color:#263f57;
  overflow:hidden;word-break:break-word
}

.calc{
  min-height:0;border:3px solid #111;border-radius:56px;background:#fff;padding:10px;
  display:grid;place-items:center;overflow:hidden
}
.calc svg{width:min(96%,560px);height:96%;display:block}
path,line{stroke:#111;stroke-linecap:round;stroke-linejoin:round}

@media (orientation:portrait){
  .app{display:none}
  .rotate-note{
    display:flex;position:fixed;inset:0;align-items:center;justify-content:center;
    padding:30px;background:#f8f4e7;color:#20384f;text-align:center;
    font-size:28px;font-weight:1000;line-height:1.5
  }
}
</style>
</head>
<body>
<div class="rotate-note">この教材はタブレットを<br>横向きにして使ってください。</div>

<div class="app">
  <div class="layout">
    <section class="top">
      <h1 class="title">◆問題</h1>
      <div class="problem">
        <div class="group">
          <input id="dividend" class="number" type="text" value="72" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off">
          <div class="cap">わられる数</div>
        </div>
        <div class="div">÷</div>
        <div class="group">
          <input id="divisor" class="number" type="text" value="3" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off">
          <div class="cap">わる数</div>
        </div>
        <button id="reset" class="reset">リセット</button>
        <button id="back" class="nav">←もどる</button>
        <button id="next" class="nav">つぎへ➡</button>
      </div>
    </section>

    <section class="body">
      <div class="col">
        <h2 class="head">◆手順</h2>
        <div id="steps" class="steps"></div>
      </div>

      <div class="col">
        <h2 class="head">◆筆算</h2>
        <div class="explain">
          <div class="explain-top">
            <div id="cNo" class="current-no">1</div>
            <div class="current-icon"><img id="cIcon" alt=""></div>
            <div id="cBadge" class="badge current-badge tateru">たてる</div>
          </div>
          <div id="desc" class="desc"></div>
        </div>
      </div>

      <div class="col">
        <h2 class="head" style="visibility:hidden">◆筆算</h2>
        <div class="calc">
          <svg viewBox="0 0 620 700" preserveAspectRatio="xMidYMid meet">
            <rect id="bgQ"  x="215" y="42"  width="190" height="72" rx="16" fill="#f6cff2" visibility="hidden"/>
            <rect id="bgP1" x="226" y="224" width="98"  height="70" rx="16" fill="#bdf2ce" visibility="hidden"/>
            <rect id="bgR1" x="226" y="322" width="98"  height="70" rx="16" fill="#f7ee99" visibility="hidden"/>
            <rect id="bgB"  x="226" y="400" width="178" height="70" rx="16" fill="#baf2f4" visibility="hidden"/>
            <rect id="bgP2" x="226" y="494" width="178" height="70" rx="16" fill="#bdf2ce" visibility="hidden"/>
            <rect id="bgF"  x="300" y="594" width="100" height="72" rx="16" fill="#f7ee99" visibility="hidden"/>

            <path d="M166 244 C194 224 200 194 202 156 H426" fill="none" stroke-width="6"/>
            <line id="line1" x1="220" y1="307" x2="340" y2="307" stroke-width="5" visibility="hidden"/>
            <line id="midLine" x1="290" y1="389" x2="410" y2="389" stroke-width="5" visibility="hidden"/>
            <line id="line2" x1="220" y1="577" x2="414" y2="577" stroke-width="5" visibility="hidden"/>

            <g font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif" font-weight="900" text-anchor="middle">
              <text id="q1" x="282" y="98" font-size="74" fill="#ff8a1f"></text>
              <text id="q2" x="370" y="98" font-size="74" fill="#ff8a1f"></text>

              <text id="dvs" x="120" y="232" font-size="74" fill="#64bb47">3</text>
              <text id="n1" x="282" y="232" font-size="84" fill="#24313f">7</text>
              <text id="n2" x="370" y="232" font-size="84" fill="#24313f">2</text>

              <text id="p1" x="278" y="278" font-size="68" fill="#ff8a1f"></text>
              <text id="r1" x="278" y="379" font-size="68" fill="#ff8a1f"></text>

              <text id="b1" x="278" y="456" font-size="68" fill="#ff8a1f"></text>
              <text id="b2" x="366" y="456" font-size="68" fill="#24313f"></text>

              <text id="p21" x="278" y="551" font-size="68" fill="#ff8a1f"></text>
              <text id="p22" x="366" y="551" font-size="68" fill="#ff8a1f"></text>

              <text id="f1" x="278" y="654" font-size="68" fill="#ff8a1f"></text>
              <text id="f2" x="366" y="654" font-size="68" fill="#24313f"></text>
            </g>
          </svg>
        </div>
      </div>
    </section>
  </div>
</div>

};
const CLS={"たてる":"tateru","かける":"kakeru","ひく":"hiku","おろす":"orosu"};
const $=id=>document.getElementById(id);
let m=null, step=0;

function split2(n){ return n<10?["",String(n)]:[String(Math.floor(n/10)),String(n%10)]; }

function makeModel(a,b){
  const tens=Math.floor(a/10), ones=a%10;

  if(tens>=b){
    const q1=Math.floor(tens/b), p1=q1*b, r1=tens-p1;
    const current=r1*10+ones, q2=Math.floor(current/b), p2=q2*b, rem=current-p2;

    return {
      mode:"two",
      a,b,tens,ones,q1,p1,r1,current,q2,p2,rem,
      steps:[
        ["たてる",`${b}のだんで ${tens} にいちばん近い数は ${p1}。${q1}をたてます。`],
        ["かける",`${b}×${q1}＝${p1}`],
        ["ひく",`${tens}−${p1}＝${r1}`],
        ["おろす",`一の位の ${ones} をおろして ${current} にします。`],
        ["たてる",`${b}のだんで ${current} にいちばん近い数は ${p2}。${q2}をたてます。`],
        ["かける",`${b}×${q2}＝${p2}`],
        ["ひく",`${current}−${p2}＝${rem}`]
      ]
    };
  }

  const q=Math.floor(a/b), p=q*b, rem=a-p;

  return {
    mode:"whole",
    a,b,tens,ones,q,p,rem,
    steps:[
      ["たてる",`${tens} は ${b} より小さいので、${a} をまとめて見ます。${q}をたてます。`],
      ["かける",`${b}×${q}＝${p}`],
      ["ひく",`${a}−${p}＝${rem}`]
    ]
  };
}
function text(id,v){$(id).textContent=v??""}
function vis(id,v){$(id).setAttribute("visibility",v?"visible":"hidden")}

function renderSteps(){
  const box=$("steps"); box.innerHTML="";
  for(let i=0;i<7;i++){
    if(i>=m.steps.length){
      const e=document.createElement("div");e.className="step";e.style.visibility="hidden";box.appendChild(e);continue;
    }
    const s=m.steps[i], e=document.createElement("div");
    e.className="step"+(i===step?" active":"");
    e.innerHTML=`<div class="step-no">${i+1}</div>
      <div class="iconbox"><img class="icon" src="${ICONS[s[0]]}" alt=""></div>
      <div class="badge ${CLS[s[0]]}">${s[0]}</div>`;
    box.appendChild(e);
  }
}
function clearBoard(){
  ["q1","q2","p1","r1","b1","b2","p21","p22","f1","f2"].forEach(id=>text(id,""));
  ["bgQ","bgP1","bgR1","bgB","bgP2","bgF","line1","midLine","line2"].forEach(id=>vis(id,false));
}
function renderBoard(){
  clearBoard();

  text("dvs",m.b);
  text("n1",m.tens);
  text("n2",m.ones);

  if(m.mode==="two"){
    if(step>=0){
      text("q1",m.q1);
      vis("bgQ",true);
    }
    if(step>=1){
      text("p1",m.p1);
      vis("bgP1",true);
      vis("line1",true);
    }
    if(step>=2){
      text("r1",m.r1);
      vis("bgR1",true);
    }
    if(step>=3){
      const x=split2(m.current);
      text("b1",x[0]);
      text("b2",x[1]);
      vis("bgB",true);
      vis("midLine",true);
    }
    if(step>=4){
      text("q2",m.q2);
      vis("bgQ",true);
    }
    if(step>=5){
      const x=split2(m.p2);
      text("p21",x[0]);
      text("p22",x[1]);
      vis("bgP2",true);
      vis("line2",true);
    }
    if(step>=6){
      if(m.rem<10){
        text("f2",m.rem);
      }else{
        const x=split2(m.rem);
        text("f1",x[0]);
        text("f2",x[1]);
      }
      vis("bgF",true);
    }
    return;
  }

  // 十の位だけでは割れない場合（例：24÷6）
  if(step>=0){
    const qParts=split2(m.q);
    text("q1",qParts[0]);
    text("q2",qParts[1]);
    vis("bgQ",true);
  }
  if(step>=1){
    const pParts=split2(m.p);
    text("p21",pParts[0]);
    text("p22",pParts[1]);
    vis("bgP2",true);
    vis("line2",true);
  }
  if(step>=2){
    if(m.rem<10){
      text("f2",m.rem);
    }else{
      const rParts=split2(m.rem);
      text("f1",rParts[0]);
      text("f2",rParts[1]);
    }
    vis("bgF",true);
  }
}
function renderCurrent(){
  const s=m.steps[step];
  $("cNo").textContent=step+1;
  $("cIcon").src=ICONS[s[0]];
  $("cBadge").textContent=s[0];
  $("cBadge").className="badge current-badge "+CLS[s[0]];
  $("desc").textContent=s[1];
}
function render(){
  renderSteps();renderCurrent();renderBoard();
  $("back").disabled=step<=0;$("next").disabled=step>=m.steps.length-1;
}
function cleanDigits(el,maxLen){
  el.value=el.value.replace(/[^0-9]/g,"").slice(0,maxLen);
}

function build(){
  const a=parseInt($("dividend").value,10);
  const b=parseInt($("divisor").value,10);

  if(!Number.isInteger(a)||a<10||a>99){
    alert("わられる数は 10〜99 の2けたを入れてください。");
    $("dividend").focus();
    return false;
  }
  if(!Number.isInteger(b)||b<2||b>9){
    alert("わる数は 2〜9 を入れてください。");
    $("divisor").focus();
    return false;
  }

  m=makeModel(a,b);
  step=0;
  render();
  return true;
}

$("reset").onclick=()=>{
  $("dividend").value="72";
  $("divisor").value="3";
  build();
};

$("back").onclick=()=>{
  if(step>0){
    step--;
    render();
  }
};

$("next").onclick=()=>{
  if(step<m.steps.length-1){
    step++;
    render();
  }
};

$("dividend").addEventListener("input",e=>cleanDigits(e.target,2));
$("divisor").addEventListener("input",e=>cleanDigits(e.target,1));

$("dividend").addEventListener("change",build);
$("divisor").addEventListener("change",build);

$("dividend").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    build();
    $("dividend").blur();
  }
});
$("divisor").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    build();
    $("divisor").blur();
  }
});

build();
</script>
