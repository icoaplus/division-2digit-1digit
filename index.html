<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二けた÷一けたのわり算｜iPad横向き版</title>
<style>
:root{
  --bg:#f8f4e7; --ink:#24313f; --line:#111;
  --blue:#5f9ed2; --blueSoft:#cfe4f4;
  --pink:#f6cff2; --mint:#bdf2ce; --yellow:#f7ee99; --cyan:#baf2f4;
  --orange:#ff8a1f; --green:#64bb47;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;background:#eef7fb;color:var(--ink)}
button,input{font:inherit}
body{padding:8px}
.rotate-note{display:none}

.app{
  width:100%;height:calc(100dvh - 16px);
  background:var(--bg);border:2px solid #8d8d8d;border-radius:22px;
  padding:14px 16px;overflow:hidden;
}
.layout{
  height:100%;display:grid;
  grid-template-rows:150px 1fr;gap:10px;
}
.top{
  min-height:0;
}
.title{font-size:26px;font-weight:1000;color:#000;margin:0 0 8px}
.problem{
  display:grid;grid-template-columns:110px 34px 110px 70px 125px 125px 125px;
  gap:12px;align-items:start;width:max-content;
}
.group{display:grid;gap:5px}
.number{
  width:110px;height:64px;border:3px solid #111;border-radius:14px;background:#fff;
  font-size:40px;font-weight:1000;text-align:center;color:#000;
}
.div{font-size:58px;font-weight:1000;line-height:1;text-align:center;align-self:center}
.cap{font-size:15px;text-align:center;color:#000}
.reset{
  width:70px;height:70px;border:0;border-radius:50%;background:#ee8aeb;font-size:14px;font-weight:900
}
.nav{
  width:125px;height:42px;border:3px solid #111;border-radius:8px;background:var(--blueSoft);
  font-size:17px;font-weight:900;margin-top:12px
}
.nav:disabled{opacity:.42}

.body{
  min-height:0;
  display:grid;
  grid-template-columns:36% 25% 39%;
  gap:12px;
}
.col{min-height:0;display:grid;grid-template-rows:auto 1fr;gap:6px}
.head{font-size:26px;font-weight:1000;color:#000;margin:0;line-height:1}

.steps{
  min-height:0;display:grid;grid-template-rows:repeat(7,minmax(0,1fr));gap:7px
}
.step{
  min-height:0;border:3px solid #111;border-radius:14px;background:#fff;
  display:grid;grid-template-columns:58px 58px 1fr;align-items:center;overflow:hidden
}
.step.active{box-shadow:inset 0 0 0 4px rgba(95,158,210,.25)}
.step-no{height:100%;display:grid;place-items:center;font-size:28px;font-weight:1000;color:#000}
.iconbox{height:100%;background:var(--blue);border-left:3px solid #111;border-right:3px solid #111;display:grid;place-items:center}
.icon{width:84%;aspect-ratio:1;object-fit:cover}
.badge{margin:0 9px;border:3px solid #111;border-radius:9px;padding:7px 6px;text-align:center;font-size:18px;font-weight:900;color:#000;white-space:nowrap}
.tateru{background:var(--pink)} .kakeru{background:var(--mint)} .hiku{background:var(--yellow)} .orosu{background:var(--cyan)}

.explain{
  min-height:0;border:3px solid #111;border-radius:34px;background:#fff;padding:10px;
  display:grid;grid-template-rows:62px 1fr;gap:10px;overflow:hidden
}
.explain-top{display:grid;grid-template-columns:52px 52px 1fr;height:62px}
.current-no{border:3px solid #111;border-right:0;border-radius:10px 0 0 10px;display:grid;place-items:center;font-size:26px;font-weight:1000;color:#000}
.current-icon{border:3px solid #111;background:var(--blue);display:grid;place-items:center}
.current-icon img{width:84%;aspect-ratio:1;object-fit:cover}
.current-badge{margin-left:9px;align-self:center}
.desc{
  min-height:0;border-radius:18px;background:#fffdf5;padding:10px 10px;
  font-size:clamp(22px,2.1vw,34px);font-weight:1000;line-height:1.28;color:#263f57;
  overflow:hidden;word-break:break-word
}

.calc{
  min-height:0;border:3px solid #111;border-radius:56px;background:#fff;padding:10px;
  display:grid;place-items:center;overflow:hidden
}
.calc svg{width:min(96%,560px);height:96%;display:block}
path,line{stroke:#111;stroke-linecap:round;stroke-linejoin:round}

@media (orientation:portrait){
  .app{display:none}
  .rotate-note{
    display:flex;position:fixed;inset:0;align-items:center;justify-content:center;
    padding:30px;background:#f8f4e7;color:#20384f;text-align:center;
    font-size:28px;font-weight:1000;line-height:1.5
  }
}

.keypad-open{
  width:92px;
  height:42px;
  margin-top:12px;
  border:3px solid var(--line);
  border-radius:8px;
  background:#fff3b7;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

.keypad-overlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(20,35,50,.18);
  z-index:9999;
}
.keypad-overlay.show{display:flex;}

.keypad{
  width:min(360px,88vw);
  background:#fff;
  border:3px solid #8298aa;
  border-radius:24px;
  padding:14px;
  box-shadow:0 14px 40px rgba(0,0,0,.18);
}
.keypad-title{
  text-align:center;
  font-size:19px;
  font-weight:1000;
  color:#294762;
  margin-bottom:10px;
}
.keypad-target{
  text-align:center;
  font-size:28px;
  font-weight:1000;
  border:2px solid #b8d9f2;
  border-radius:12px;
  padding:8px;
  margin-bottom:10px;
  background:#f8fcff;
}
.keypad-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}
.keypad-key{
  height:56px;
  border:2px solid #9fb5c7;
  border-radius:12px;
  background:#eef7fd;
  font-size:26px;
  font-weight:1000;
  cursor:pointer;
}
.keypad-key.action{
  background:#f3f3f3;
  font-size:17px;
}
.keypad-key.ok{
  background:#cfe8c8;
  font-size:18px;
}
.keypad-close{
  width:100%;
  height:44px;
  margin-top:10px;
  border:2px solid #9fb5c7;
  border-radius:12px;
  background:#f1f4f7;
  font-size:17px;
  font-weight:900;
}
.number.keypad-active{
  outline:4px solid rgba(95,158,210,.25);
  border-color:#5f9ed2;
}


.number{
  touch-action:manipulation;
  -webkit-user-select:text;
  user-select:text;
  caret-color:#111;
}
.number:focus{
  border-color:#5f9ed2;
  outline:4px solid rgba(95,158,210,.22);
}


@media (min-width:1200px) and (orientation:landscape){
  .app{
    max-width:1600px;
    margin:0 auto;
  }
  .body{
    grid-template-columns:36% 25% 39%;
  }
}

</style>
</head>

Object.values(ICONS).forEach(src=>{ const im=new Image(); im.src=src; });

const CLS={"たてる":"tateru","かける":"kakeru","ひく":"hiku","おろす":"orosu"};
const $=id=>document.getElementById(id);
let m=null, step=-1, started=false;

function split2(n){ return n<10?["",String(n)]:[String(Math.floor(n/10)),String(n%10)]; }

function makeModel(a,b){
  const tens=Math.floor(a/10), ones=a%10;

  if(tens>=b){
    const q1=Math.floor(tens/b), p1=q1*b, r1=tens-p1;
    const current=r1*10+ones, q2=Math.floor(current/b), p2=q2*b, rem=current-p2;

    return {
      mode:"two",
      a,b,tens,ones,q1,p1,r1,current,q2,p2,rem,
      steps:[
        ["たてる",`${b}のだんで ${tens} にいちばん近い数は ${p1}。${q1}をたてます。`],
        ["かける",`${b}×${q1}＝${p1}`],
        ["ひく",`${tens}−${p1}＝${r1}`],
        ["おろす",`一の位の ${ones} をおろして ${current} にします。`],
        ["たてる",`${b}のだんで ${current} にいちばん近い数は ${p2}。${q2}をたてます。`],
        ["かける",`${b}×${q2}＝${p2}`],
        ["ひく",`${current}−${p2}＝${rem}`]
      ]
    };
  }

  const q=Math.floor(a/b), p=q*b, rem=a-p;

  return {
    mode:"whole",
    a,b,tens,ones,q,p,rem,
    steps:[
      ["たてる",`${tens} は ${b} より小さいので、${a} をまとめて見ます。${q}をたてます。`],
      ["かける",`${b}×${q}＝${p}`],
      ["ひく",`${a}−${p}＝${rem}`]
    ]
  };
}
function text(id,v){$(id).textContent=v??""}
function vis(id,v){$(id).setAttribute("visibility",v?"visible":"hidden")}

function renderSteps(){
  const box=$("steps"); box.innerHTML="";
  for(let i=0;i<7;i++){
    if(i>=m.steps.length){
      const e=document.createElement("div");e.className="step";e.style.visibility="hidden";box.appendChild(e);continue;
    }
    const s=m.steps[i], e=document.createElement("div");
    e.className="step"+(i===step?" active":"");
    e.innerHTML=`<div class="step-no">${i+1}</div>
      <div class="iconbox"><img class="icon" src="${ICONS[s[0]]}" alt="${s[0]}" decoding="sync" draggable="false"></div>
      <div class="badge ${CLS[s[0]]}">${s[0]}</div>`;
    box.appendChild(e);
  }
}
function clearBoard(){
  ["q1","q2","p1","r1","b1","b2","p21","p22","f1","f2"].forEach(id=>text(id,""));
  ["bgQ","bgP1","bgR1","bgB","bgP2","bgF","line1","midLine","line2"].forEach(id=>vis(id,false));
}
function renderBoard(){
  clearBoard();

  text("dvs",m.b);
  text("n1",m.tens);
  text("n2",m.ones);

  if(m.mode==="two"){
    if(step>=0){
      text("q1",m.q1);
      vis("bgQ",true);
    }
    if(step>=1){
      text("p1",m.p1);
      vis("bgP1",true);
      vis("line1",true);
    }
    if(step>=2){
      text("r1",m.r1);
      vis("bgR1",true);
    }
    if(step>=3){
      const x=split2(m.current);
      text("b1",x[0]);
      text("b2",x[1]);
      vis("bgB",true);
      vis("midLine",true);
    }
    if(step>=4){
      text("q2",m.q2);
      vis("bgQ",true);
    }
    if(step>=5){
      const x=split2(m.p2);
      text("p21",x[0]);
      text("p22",x[1]);
      vis("bgP2",true);
      vis("line2",true);
    }
    if(step>=6){
      if(m.rem<10){
        text("f2",m.rem);
      }else{
        const x=split2(m.rem);
        text("f1",x[0]);
        text("f2",x[1]);
      }
      vis("bgF",true);
    }
    return;
  }

  // 十の位だけでは割れない場合（例：24÷6）
  if(step>=0){
    const qParts=split2(m.q);
    text("q1",qParts[0]);
    text("q2",qParts[1]);
    vis("bgQ",true);
  }
  if(step>=1){
    const pParts=split2(m.p);
    text("p21",pParts[0]);
    text("p22",pParts[1]);
    vis("bgP2",true);
    vis("line2",true);
  }
  if(step>=2){
    if(m.rem<10){
      text("f2",m.rem);
    }else{
      const rParts=split2(m.rem);
      text("f1",rParts[0]);
      text("f2",rParts[1]);
    }
    vis("bgF",true);
  }
}
function renderCurrent(){
  const s=m.steps[step];
  $("cNo").textContent=step+1;
  $("cIcon").src=ICONS[s[0]]; $("cIcon").alt=s[0];
  $("cBadge").textContent=s[0];
  $("cBadge").className="badge current-badge "+CLS[s[0]];
  $("desc").textContent=s[1];
}
function render(){
  renderSteps();

  if(step < 0){
    $("cNo").textContent = "—";
    $("cIcon").removeAttribute("src");
    $("cBadge").textContent = "スタート";
    $("cBadge").className = "badge current-badge";
    $("cBadge").style.background = "#ffffff";
    $("desc").textContent = "数字を入力して「スタート」を押してください。";

    clearBoard();
    text("dvs",m.b);
    text("n1",m.tens);
    text("n2",m.ones);

    $("back").disabled = true;
    $("next").disabled = !started;
    return;
  }

  $("cBadge").style.background = "";
  renderCurrent();
  renderBoard();

  $("back").disabled = step < 0;
  $("next").disabled = step >= m.steps.length - 1;
}
function cleanDigits(el,maxLen){
  el.value=el.value.replace(/[^0-9]/g,"").slice(0,maxLen);
}

function build(){
  const a=parseInt($("dividend").value,10);
  const b=parseInt($("divisor").value,10);

  if(!Number.isInteger(a)||a<10||a>99){
    alert("わられる数は 10〜99 の2けたを入れてください。");
    $("dividend").focus();
    return false;
  }
  if(!Number.isInteger(b)||b<2||b>9){
    alert("わる数は 2〜9 を入れてください。");
    $("divisor").focus();
    return false;
  }

  m=makeModel(a,b);
  step=-1;
  render();
  return true;
}

$("start").onclick=()=>{
  if(build()){
    started=true;
    step=-1;
    render();
  }
};

$("reset").onclick=()=>{
  const a=parseInt($("dividend").value,10);
  const b=parseInt($("divisor").value,10);
  if(Number.isInteger(a) && a>=10 && a<=99 && Number.isInteger(b) && b>=2 && b<=9){
    m=makeModel(a,b);
    started=false;
    step=-1;
    render();
  }
};

$("back").onclick=()=>{
  if(step>0){
    step--;
    render();
  }else if(step===0){
    step=-1;
    render();
  }
};

$("next").onclick=()=>{
  if(!started) return;
  if(step < 0){
    step=0;
    render();
    return;
  }
  if(step<m.steps.length-1){
    step++;
    render();
  }
};


function markInputChanged(){
  started=false;
  const a=parseInt($("dividend").value,10);
  const b=parseInt($("divisor").value,10);
  if(Number.isInteger(a) && a>=10 && a<=99 && Number.isInteger(b) && b>=2 && b<=9){
    m=makeModel(a,b);
    step=-1;
    render();
  }else{
    $("next").disabled=true;
    $("back").disabled=true;
  }
}

$("dividend").addEventListener("input",e=>{cleanDigits(e.target,2);markInputChanged();});
$("divisor").addEventListener("input",e=>{cleanDigits(e.target,1);markInputChanged();});



$("dividend").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    $("dividend").blur();
  }
});
$("divisor").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    $("divisor").blur();
  }
});


let keypadTargetInput = $("dividend");

function setKeypadTarget(input){
  keypadTargetInput = input;
  $("dividend").classList.remove("keypad-active");
  $("divisor").classList.remove("keypad-active");
  input.classList.add("keypad-active");
  $("keypadTarget").textContent = input.value || "0";
}

function openKeypad(){
  setKeypadTarget(document.activeElement === $("divisor") ? $("divisor") : 
                  document.activeElement === $("dividend") ? $("dividend") : keypadTargetInput);
  $("keypadOverlay").classList.add("show");
  $("keypadOverlay").setAttribute("aria-hidden","false");
}

function closeKeypad(){
  $("keypadOverlay").classList.remove("show");
  $("keypadOverlay").setAttribute("aria-hidden","true");
  $("dividend").classList.remove("keypad-active");
  $("divisor").classList.remove("keypad-active");
}

$("dividend").addEventListener("click",()=>{
  setKeypadTarget($("dividend"));
  openKeypad();
});
$("divisor").addEventListener("click",()=>{
  setKeypadTarget($("divisor"));
  openKeypad();
});

document.querySelectorAll(".keypad-key[data-key]").forEach(btn=>{
  btn.addEventListener("click",(e)=>{
    e.preventDefault();
    const maxLen = keypadTargetInput === $("dividend") ? 2 : 1;
    let value = (keypadTargetInput.value || "").replace(/[^0-9]/g,"");
    if(value.length < maxLen){
      value += btn.dataset.key;
      keypadTargetInput.value = value;
      $("keypadTarget").textContent = value || "0";
    }
  });
});

document.querySelectorAll(".keypad-key[data-action]").forEach(btn=>{
  btn.addEventListener("click",(e)=>{
    e.preventDefault();
    let value = keypadTargetInput.value || "";
    if(btn.dataset.action === "clear"){
      value = "";
    }else if(btn.dataset.action === "backspace"){
      value = value.slice(0,-1);
    }
    keypadTargetInput.value = value;
    $("keypadTarget").textContent = value || "0";
  });
});

$("keypadOk").addEventListener("click",()=>{
  markInputChanged();
  closeKeypad();
});
$("keypadClose").addEventListener("click", closeKeypad);

$("keypadOverlay").addEventListener("click",(e)=>{
  if(e.target === $("keypadOverlay")) closeKeypad();
});

build();
</script>

</body>
</html>
